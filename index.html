<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090b0d">
<link rel="apple-touch-icon" href="./assets/escape-icon.png.JPG">
<title>ESCAPE — Prototype</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body><div class="app"><div class="top"><strong>ESCAPE / TEST BUILD</strong><span id="roomLabel">ROOM 01</span></div><div class="gamewrap" id="gamewrap"><canvas id="game" width="384" height="256" aria-label="ゲーム画面"></canvas>
<img id="jumpscare" src="./assets/jumpscare.PNG" alt="" style="display:none;">
<div class="hud"><span class="tag" id="itemHud">所持品：なし</span><span class="tag" id="stateHud">探索中</span></div><div class="message" id="message"></div><div class="overlay" id="overlay"><div class="panel"><h1 id="panelTitle">ESCAPE</h1><p id="panelText">見知らぬ校舎に閉じ込められた。<br>鍵を探し、出口を目指せ。</p><button class="btn primary" id="startBtn">はじめから</button><button class="btn" id="helpBtn">操作方法</button><div class="hint">試作品 / セーブ機能は未実装</div></div></div></div><div class="bottom"><div class="pad" id="pad"><div class="stick" id="stick"></div></div><div class="actions"><button class="btn primary" id="actBtn">調べる / 開ける</button><button class="btn" id="runBtn">走る</button><button class="btn" id="hideBtn">隠れる</button><button class="btn" id="menuBtn">メニュー</button></div></div></div>
<script src="./js/game.js"></script>
</body></html>
