<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090b0d"><title>ESCAPE — Prototype</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0c;color:#eee;font-family:system-ui,-apple-system,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}.app{width:100vw;height:100dvh;display:flex;flex-direction:column;background:#080a0c}.top{height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#111519;border-bottom:1px solid #30373a;font-size:12px;letter-spacing:.12em}.top strong{color:#c8d0ce}.gamewrap{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center;background:#050607;overflow:hidden}canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;image-rendering:pixelated;object-fit:contain}.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:12px;text-shadow:0 2px 3px #000}.tag{background:#080b0dd9;border:1px solid #465052;padding:6px 8px}.message{position:absolute;left:50%;top:17%;transform:translateX(-50%);background:#080b0df2;border:1px solid #6d7778;padding:10px 14px;max-width:85%;text-align:center;font-size:13px;display:none}.bottom{height:112px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 14px max(8px,env(safe-area-inset-bottom));background:#111519;border-top:1px solid #30373a;gap:12px}.pad{width:124px;height:92px;position:relative;flex-shrink:0}.stick{position:absolute;width:52px;height:52px;border-radius:50%;left:36px;top:20px;background:#353e40;border:2px solid #687577;box-shadow:inset 0 0 0 5px #22292b}.stick:after{content:'';position:absolute;inset:13px;border-radius:50%;background:#8b9695}.actions{display:grid;grid-template-columns:repeat(2,minmax(66px,1fr));gap:7px;max-width:250px;flex:1}.btn{background:#20282b;border:1px solid #566164;color:#f2f4f3;border-radius:5px;min-height:39px;font-size:12px;font-weight:600;touch-action:none}.btn:active,.btn.active{background:#495355}.btn.primary{border-color:#a0b0aa;color:#dce7df}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050708eF;z-index:5;padding:18px}.panel{width:min(340px,95%);padding:24px 20px;background:#111719;border:1px solid #515c5d;text-align:center;box-shadow:0 12px 40px #000}.panel h1{font-size:25px;letter-spacing:.2em;margin:0 0 5px;color:#d6ddda}.panel p{font-size:12px;color:#a8b1af;line-height:1.7;margin:8px 0 20px}.panel .btn{width:100%;margin-top:8px;min-height:43px}.inventory{font-size:12px;color:#d5ddda}.hint{font-size:10px;color:#8e9997;margin-top:7px}@media (orientation:portrait){.top{height:32px}.bottom{height:106px}.panel h1{font-size:21px}}
</style></head>
<body><div class="app"><div class="top"><strong>ESCAPE / TEST BUILD</strong><span id="roomLabel">ROOM 01</span></div><div class="gamewrap" id="gamewrap"><canvas id="game" width="384" height="256" aria-label="ゲーム画面"></canvas><div class="hud"><span class="tag" id="itemHud">所持品：なし</span><span class="tag" id="stateHud">探索中</span></div><div class="message" id="message"></div><div class="overlay" id="overlay"><div class="panel"><h1 id="panelTitle">ESCAPE</h1><p id="panelText">見知らぬ校舎に閉じ込められた。<br>鍵を探し、出口を目指せ。</p><button class="btn primary" id="startBtn">はじめから</button><button class="btn" id="helpBtn">操作方法</button><div class="hint">試作品 / セーブ機能は未実装</div></div></div></div><div class="bottom"><div class="pad" id="pad"><div class="stick" id="stick"></div></div><div class="actions"><button class="btn primary" id="actBtn">調べる / 開ける</button><button class="btn" id="runBtn">走る</button><button class="btn" id="hideBtn">隠れる</button><button class="btn" id="menuBtn">メニュー</button></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);const imgs={};for(const n of ['floor','floor_alt','floor_horror','floor_decayed','wall','wall_cracked','locker','locker_decayed','desk','chair','door','window','board','cubby','student_idle','student_walk','wall_drip']){imgs[n]=new Image();imgs[n].src='assets/'+n+'.png'}
const TILE=32,W=12,H=8,rooms=[{name:'教室',doors:[{x:11,y:3,to:1,tx:1,ty:3}],lockers:[[2,2]],furniture:[[4,2,'desk'],[7,5,'desk'],[8,2,'chair']],keySpot:null},{name:'廊下',doors:[{x:0,y:3,to:0,tx:10,ty:3},{x:11,y:5,to:2,tx:1,ty:5}],lockers:[[3,1],[8,6]],furniture:[[5,2,'cubby'],[6,6,'desk']],keySpot:null},{name:'準備室',doors:[{x:0,y:5,to:1,tx:10,ty:5}],lockers:[[2,2]],furniture:[[5,2,'desk'],[7,4,'cubby']],keySpot:null}];
let room=0,player={x:3.5,y:4.5,dir:'down',hidden:false},enemy={x:8,y:4,dir:0,mode:'wander',timer:0},hasKey=false,unlocked=false,gameOver=false,won=false,running=false,move={x:0,y:0},last=0,msgTimer=0,gameStarted=false;
function chooseKey(){rooms.forEach(r=>r.keySpot=null);const ri=Math.random()<.5?0:1;const candidates=ri===0?[[6,5],[9,2],[3,5]]:[[4,4],[8,2],[6,6]];rooms[ri].keySpot=candidates[Math.floor(Math.random()*candidates.length)];}
function reset(){room=0;player={x:3.5,y:4.5,dir:'down',hidden:false};enemy={x:8,y:4,dir:Math.PI,mode:'wander',timer:0,room:0};hasKey=false;unlocked=false;gameOver=false;won=false;running=false;chooseKey();$('overlay').style.display='none';$('roomLabel').textContent='ROOM 01';$('itemHud').textContent='所持品：なし';$('stateHud').textContent='探索中';gameStarted=true;notify('鍵を探して出口へ向かおう');last=performance.now();requestAnimationFrame(loop)}
function notify(t){const e=$('message');e.textContent=t;e.style.display='block';msgTimer=2.2}
function tileImg(name,x,y,w=TILE,h=TILE){const im=imgs[name];if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,x,y,w,h)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const r=rooms[room];for(let y=0;y<H;y++)for(let x=0;x<W;x++){tileImg((x+y)%7===0?'floor_alt':'floor',x*TILE,y*TILE);if((x*3+y*7+room)%37===0)tileImg('floor_horror',x*TILE,y*TILE)}
// room perimeter walls, door gaps
for(let x=0;x<W;x++){tileImg('wall',x*TILE,0);tileImg('wall',x*TILE,(H-1)*TILE)}for(let y=1;y<H-1;y++){if(!r.doors.some(d=>d.x===0&&d.y===y))tileImg('wall',0,y*TILE);if(!r.doors.some(d=>d.x===W-1&&d.y===y))tileImg('wall',(W-1)*TILE,y*TILE)}
// windows and decorations
if(room===0){tileImg('window',3*TILE,0,64,32);tileImg('board',7*TILE,0,64,32)}else if(room===1){tileImg('wall_drip',5*TILE,0,32,32);tileImg('window',7*TILE,0,64,32)}else{tileImg('wall_cracked',3*TILE,0);tileImg('wall_drip',8*TILE,0,32,32)}
// doors
for(const d of r.doors){ctx.fillStyle='#070909';ctx.fillRect(d.x*TILE,d.y*TILE,TILE,TILE);tileImg('door',d.x*TILE-16,d.y*TILE-16,64,64);if(d.to===2&&unlocked){ctx.fillStyle='#b7c9bc';ctx.fillRect(d.x*TILE+10,d.y*TILE+5,12,22)}}
// furniture
for(const [x,y,type] of r.furniture)tileImg(type,x*TILE,y*TILE,48,48);for(const [x,y] of r.lockers)tileImg('locker',x*TILE,y*TILE,48,48);
// key on floor
if(!hasKey&&r.keySpot){const [kx,ky]=r.keySpot;ctx.fillStyle='#e7c56e';ctx.fillRect(kx*TILE+12,ky*TILE+12,10,4);ctx.fillRect(kx*TILE+19,ky*TILE+13,3,8);ctx.fillRect(kx*TILE+17,ky*TILE+18,3,3);}
// enemy cone
if(!player.hidden&&room===enemy.room){ctx.save();ctx.globalAlpha=enemy.mode==='chase'?.18:.09;ctx.fillStyle=enemy.mode==='chase'?'#ff3434':'#e2d9aa';ctx.beginPath();ctx.moveTo(enemy.x*TILE,enemy.y*TILE);ctx.arc(enemy.x*TILE,enemy.y*TILE,enemy.mode==='chase'?130:100,enemy.dir-.58,enemy.dir+.58);ctx.closePath();ctx.fill();ctx.restore();drawCharacter(enemy.x,enemy.y,'enemy')}
if(!player.hidden)drawCharacter(player.x,player.y,'player');else{ctx.fillStyle='#a7b3ad';ctx.font='12px sans-serif';ctx.fillText('隠れている',8,canvas.height-10)}
// vignette
const g=ctx.createRadialGradient(192,128,45,192,128,245);g.addColorStop(0,'#00000000');g.addColorStop(1,'#00000080');ctx.fillStyle=g;ctx.fillRect(0,0,384,256);
}
function drawCharacter(x,y,type){const px=x*TILE,py=y*TILE;if(type==='enemy'){ctx.fillStyle='#191719';ctx.fillRect(px-7,py-10,14,20);ctx.fillStyle='#a52626';ctx.fillRect(px-5,py-6,3,3);ctx.fillRect(px+2,py-6,3,3);ctx.fillStyle='#555052';ctx.fillRect(px-8,py+7,16,5)}else{let im=imgs.student_idle;if(im&&im.complete&&im.naturalWidth){ctx.drawImage(im,px-12,py-14,24,24)}else{ctx.fillStyle='#d6d9d2';ctx.fillRect(px-6,py-9,12,17);ctx.fillStyle='#222';ctx.fillRect(px-4,py-6,2,2);ctx.fillRect(px+2,py-6,2,2)}}}
function collides(x,y){if(x<1||x>W-1||y<1||y>H-1)return true;const r=rooms[room];if(r.doors.some(d=>Math.abs(x-(d.x+.5))<.65&&Math.abs(y-(d.y+.5))<.65))return false;for(const [fx,fy] of r.furniture)if(x>fx-.1&&x<fx+1.35&&y>fy-.1&&y<fy+1.25)return true;for(const [fx,fy] of r.lockers)if(x>fx-.1&&x<fx+1.25&&y>fy-.1&&y<fy+1.25)return true;return false}
function direction(dx,dy){if(Math.abs(dx)>Math.abs(dy))return dx>0?'right':'left';return dy>0?'down':'up'}
function update(dt){if(!gameStarted||gameOver||won)return;if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)$('message').style.display='none'}if(!player.hidden){let speed=running?3.0:1.85,dx=move.x*speed*dt,dy=move.y*speed*dt;if(dx||dy){player.dir=direction(dx,dy);if(!collides(player.x+dx,player.y))player.x+=dx;if(!collides(player.x,player.y+dy))player.y+=dy}}
// random roaming enemy
enemy.timer-=dt;if(room===enemy.room&&enemy.timer<=0){enemy.timer=.8+Math.random()*1.6;enemy.dir=Math.random()*Math.PI*2;enemy.mode=enemy.mode==='chase'?'chase':'wander'}if(room!==enemy.room){$('stateHud').textContent='探索中';return}let dx=player.x-enemy.x,dy=player.y-enemy.y,dist=Math.hypot(dx,dy);const facing=Math.atan2(Math.sin(Math.atan2(dy,dx)-enemy.dir),Math.cos(Math.atan2(dy,dx)-enemy.dir));const sees=!player.hidden&&dist<3.6&&Math.abs(facing)<.58;
if(sees){enemy.mode='chase';enemy.dir=Math.atan2(dy,dx);$('stateHud').textContent='!! 発見された !!';}else if(enemy.mode==='chase'&&dist>5){enemy.mode='wander';notify('敵を見失ったようだ');$('stateHud').textContent='探索中'}
let es=enemy.mode==='chase'?1.5:.65;if(enemy.mode==='chase'){enemy.x+=Math.cos(enemy.dir)*es*dt;enemy.y+=Math.sin(enemy.dir)*es*dt}else{const nx=enemy.x+Math.cos(enemy.dir)*es*dt,ny=enemy.y+Math.sin(enemy.dir)*es*dt;if(collides(nx,ny)){enemy.dir+=Math.PI*(.6+Math.random()*.8)}else{enemy.x=nx;enemy.y=ny}}
if(!player.hidden&&room===enemy.room&&dist<.48){finish(false)}
$('itemHud').textContent='所持品：'+(hasKey?'鍵':'なし');if(enemy.mode!=='chase')$('stateHud').textContent='探索中';}
function finish(win){gameOver=!win;won=win;gameStarted=false;$('overlay').style.display='flex';$('panelTitle').textContent=win?'ESCAPED':'GAME OVER';$('panelText').innerHTML=win?'出口から脱出した。<br>試作品クリア！':'敵に捕まってしまった。<br>タイトルからやり直そう。';$('startBtn').textContent='はじめから';$('helpBtn').textContent='操作方法';}
function act(){if(!gameStarted)return;const r=rooms[room];if(player.hidden){player.hidden=false;notify('ロッカーから出た');return}
// door nearby
const d=r.doors.find(d=>Math.hypot(player.x-(d.x+.5),player.y-(d.y+.5))<1.5);if(d){if(d.to===2&&!hasKey&&!unlocked){notify('鍵がかかっている');return}if(d.to===2){unlocked=true;finish(true);return}room=d.to;player.x=d.tx+.5;player.y=d.ty+.5;$('roomLabel').textContent='ROOM 0'+(room+1)+' / '+rooms[room].name;notify(rooms[room].name+'に入った');return}
// key pickup
if(!hasKey&&r.keySpot&&Math.hypot(player.x-(r.keySpot[0]+.5),player.y-(r.keySpot[1]+.5))<1.25){hasKey=true;r.keySpot=null;notify('鍵を手に入れた');return}
// furniture/locker inspect
for(const [x,y] of r.lockers){if(Math.hypot(player.x-(x+.5),player.y-(y+.5))<1.4){player.hidden=true;notify('ロッカーに隠れた');return}}
for(const [x,y] of r.furniture){if(Math.hypot(player.x-(x+.5),player.y-(y+.5))<1.4){if(!hasKey&&r.keySpot&&Math.hypot(r.keySpot[0]-x,r.keySpot[1]-y)<2){hasKey=true;r.keySpot=null;notify('家具のそばで鍵を見つけた');}else notify('特に何も見つからない');return}}
notify('近くに調べられるものはない');}
function help(){ $('panelTitle').textContent='操作方法';$('panelText').innerHTML='左のパッド：移動<br>走る：移動速度アップ<br>調べる / 開ける：鍵・ドア・家具<br>隠れる：近くのロッカー<br>敵の正面に入らないように進もう。';$('startBtn').textContent='ゲームに戻る';$('helpBtn').style.display='none';$('overlay').style.display='flex';}
$('startBtn').onclick=()=>{if(gameStarted){$('overlay').style.display='none';return} $('helpBtn').style.display='';reset()};$('helpBtn').onclick=help;$('actBtn').onpointerdown=e=>{e.preventDefault();act()};$('runBtn').onpointerdown=e=>{e.preventDefault();running=true;$('runBtn').classList.add('active')};['pointerup','pointercancel','pointerleave'].forEach(ev=>$('runBtn').addEventListener(ev,()=>{running=false;$('runBtn').classList.remove('active')}));$('hideBtn').onclick=()=>{if(!gameStarted)return;if(player.hidden){player.hidden=false;notify('ロッカーから出た')}else{const r=rooms[room],near=r.lockers.some(([x,y])=>Math.hypot(player.x-(x+.5),player.y-(y+.5))<1.5);if(near){player.hidden=true;notify('ロッカーに隠れた')}else notify('近くにロッカーがない')}};$('menuBtn').onclick=()=>{if(!gameStarted)return;$('panelTitle').textContent='PAUSE';$('panelText').innerHTML='ゲームを一時停止中';$('startBtn').textContent='ゲームに戻る';$('helpBtn').style.display='';$('overlay').style.display='flex'};
let active=false,padRect=null;const pad=$('pad'),stick=$('stick');function setStick(e){padRect=pad.getBoundingClientRect();let cx=padRect.left+padRect.width/2,cy=padRect.top+padRect.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=31,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}move={x:dx/max,y:dy/max};stick.style.transform=`translate(${dx}px,${dy}px)`}pad.onpointerdown=e=>{active=true;pad.setPointerCapture(e.pointerId);setStick(e)};pad.onpointermove=e=>{if(active)setStick(e)};function release(){active=false;move={x:0,y:0};stick.style.transform='translate(0,0)'}pad.onpointerup=release;pad.onpointercancel=release;
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move.x=-1;if(e.key==='ArrowRight'||e.key==='d')move.x=1;if(e.key==='ArrowUp'||e.key==='w')move.y=-1;if(e.key==='ArrowDown'||e.key==='s')move.y=1;if(e.key==='Shift')running=true;if(e.key===' '||e.key==='Enter')act()});window.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))move.x=0;if(['ArrowUp','ArrowDown','w','s'].includes(e.key))move.y=0;if(e.key==='Shift')running=false});
function loop(t){if(!gameStarted)return;let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
// Render preview behind title overlay
chooseKey();draw();
})();
</script></body></html>
